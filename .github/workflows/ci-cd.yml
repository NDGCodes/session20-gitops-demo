name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install && npm run build
        working-directory: frontend
  sast:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@v3
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install && npm audit --audit-level=high
        working-directory: frontend
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/workspace:ro" aquasec/trivy:latest fs --scanners secret --exit-code 1 /workspace
  build-scan-push:
    needs: [test, sast, sca, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/$IMAGE_OWNER/taskboard-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/$IMAGE_OWNER/taskboard-frontend:${{ github.sha }} ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/taskboard-backend:${{ github.sha }}
          trivy-config: security/trivy.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/taskboard-frontend:${{ github.sha }}
          trivy-config: security/trivy.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Push scanned images
        run: |
          docker push ghcr.io/$IMAGE_OWNER/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/$IMAGE_OWNER/taskboard-frontend:${{ github.sha }}
  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.10.0
        with: {cluster_name: taskboard-ci}
      - name: Load tested images into CI cluster
        run: |
          docker pull ghcr.io/$IMAGE_OWNER/taskboard-backend:${{ github.sha }}
          docker pull ghcr.io/$IMAGE_OWNER/taskboard-frontend:${{ github.sha }}
          kind load docker-image --name taskboard-ci ghcr.io/$IMAGE_OWNER/taskboard-backend:${{ github.sha }} ghcr.io/$IMAGE_OWNER/taskboard-frontend:${{ github.sha }}
      - name: Deploy and verify with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace --wait --timeout 5m \
            --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/$IMAGE_OWNER/taskboard-backend \
            --set frontend.image=ghcr.io/$IMAGE_OWNER/taskboard-frontend \
            --set monitoring.serviceMonitor.enabled=false --set hpa.enabled=false
          kubectl get pods,svc,pvc -n taskboard
          kubectl exec -n taskboard deployment/taskboard-taskboard-backend -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/ready').read().decode())"
